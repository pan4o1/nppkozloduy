name: Update market consultations

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/scrape.py"

permissions:
  contents: write

concurrency:
  group: market-consultations-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect current data
        run: python scripts/scrape.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/consultations.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/consultations.json
          git commit -m "data: update market consultations"
          git push
